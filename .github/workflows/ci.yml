name: CI

on:
  push:
    branches: [ main, develop, damien3 ]
  pull_request:
    branches: [ main, damien3 ]

env:
  NODE_VERSION: '18'
  VITE_API_BASE_URL: http://localhost:5000
  VITE_ML_API_BASE_URL: http://localhost:5001/api/v1/covid

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run unit tests
      run: npm run test:ci
      env:
        NODE_ENV: test
        VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        VITE_ML_API_BASE_URL: ${{ env.VITE_ML_API_BASE_URL }}
    
    - name: Start application for E2E tests
      run: |
        npm run dev -- --host 0.0.0.0 &
        echo $! > .app_pid
      env:
        VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        VITE_ML_API_BASE_URL: ${{ env.VITE_ML_API_BASE_URL }}
    
    - name: Wait for application to start
      run: |
        timeout 120 bash -c 'until curl -f http://localhost:5173/; do sleep 3; done'
        echo "Application is ready"
    
    - name: Run E2E tests
      uses: cypress-io/github-action@v6
      with:
        start: npm run dev
        wait-on: 'http://localhost:5173'
        wait-on-timeout: 120
        browser: chrome
      env:
        CYPRESS_baseUrl: http://localhost:5173
    
    - name: Stop application
      if: always()
      run: |
        if [ -f .app_pid ]; then
          kill $(cat .app_pid) || true
          rm .app_pid
        fi
        pkill -f "vite" || true
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: always()
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build
      env:
        VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        VITE_ML_API_BASE_URL: ${{ env.VITE_ML_API_BASE_URL }}
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/