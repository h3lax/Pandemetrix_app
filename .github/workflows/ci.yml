name: CI

on:
  push:
    branches: [ main, develop, damien3 ]
  pull_request:
    branches: [ main, damien3 ]

env:
  NODE_VERSION: '18'
  VITE_API_BASE_URL: http://localhost:5000
  VITE_ML_API_BASE_URL: http://localhost:5001/api/v1/covid

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        # Vérifier que cypress-real-events est installé
        npm list cypress-real-events || npm install --save-dev cypress-real-events@1.14.0
        npm list cypress-wait-until || npm install --save-dev cypress-wait-until@3.0.1
    
    - name: Run unit tests
      run: npm run test:ci
      env:
        NODE_ENV: test
        VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        VITE_ML_API_BASE_URL: ${{ env.VITE_ML_API_BASE_URL }}
    
    - name: Start Mock API Services
      run: |
        # Démarrer un serveur mock pour les APIs en arrière-plan
        node scripts/mock-server.js &
        echo $! > .mock_server_pid
        sleep 5
      continue-on-error: true
    
    - name: Run E2E tests
      uses: cypress-io/github-action@v6
      with:
        start: npm run dev
        wait-on: 'http://localhost:5173'
        wait-on-timeout: 120
        browser: chrome
        config: defaultCommandTimeout=15000,requestTimeout=15000,responseTimeout=15000
      env:
        CYPRESS_baseUrl: http://localhost:5173
        # Désactiver les vraies APIs pour les tests
        CYPRESS_MOCK_API: true
    
    - name: Stop services
      if: always()
      run: |
        # Arrêter le serveur mock
        if [ -f .mock_server_pid ]; then
          kill $(cat .mock_server_pid) || true
          rm .mock_server_pid
        fi
        # Arrêter Vite
        pkill -f "vite" || true
    
    - name: Upload Cypress screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cypress-screenshots
        path: cypress/screenshots
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: always()
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build
      env:
        VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        VITE_ML_API_BASE_URL: ${{ env.VITE_ML_API_BASE_URL }}
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/